
services:
  - type: web
    name: partpilot-llm-gateway
    runtime: python
    plan: free

    buildCommand: python --version
    startCommand: python gateway/server.py
    healthCheckPath: /health

    envVars:
      - key: GEMINI_API_KEY
        sync: false

      - key: GATEWAY_TOKEN
        sync: false

      - key: GEMINI_MODEL
        value: gemini-2.5-flash

      - key: GEMINI_API_VERSION
        value: v1beta

      - key: PYTHON_VERSION
        value: 3.12.14
